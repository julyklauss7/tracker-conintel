<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Semanal — Conintel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0efe9;color:#1a1a18;min-height:100vh}
nav{background:#0f2a52;padding:0 28px;display:flex;justify-content:space-between;align-items:center;height:56px}
nav .logo{color:#fff;font-size:15px;font-weight:600}
nav .logo span{color:#7eb3f5;font-weight:400}
.ctrl-strip{background:#fff;border-bottom:1px solid #e8e7e0;padding:10px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:8px}
.ctrl-group label{font-size:12px;color:#72716c;font-weight:500}
.ctrl-group select{font-size:13px;padding:6px 10px;border:1px solid #dddcd5;border-radius:8px;background:#fafaf8;color:#1a1a18;outline:none}
.btn-tab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:#f0efe9;color:#52514e;border:1px solid #e8e7e0}
.btn-tab.active{background:#0f2a52;color:#fff;border-color:#0f2a52}
.main{padding:24px 28px;max-width:960px;margin:0 auto}
.week-tabs{display:flex;gap:8px;margin-bottom:20px}
.resumen-card{background:#fff;border:1px solid #e8e7e0;border-radius:16px;padding:20px 24px;margin-bottom:24px}
.section-title{font-size:12px;font-weight:700;color:#0f2a52;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.section-title span{font-size:11px;color:#a8a7a0;font-weight:400;text-transform:none;letter-spacing:0}
.big-bar-track{height:14px;background:#f0efe9;border-radius:8px;overflow:hidden}
.big-bar-fill{height:100%;border-radius:8px;transition:width .6s}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.kpi{background:#f5f5f2;border-radius:10px;padding:10px 12px;text-align:center}
.kpi .kv{font-size:17px;font-weight:700;color:#1a1a18}
.kpi .kl{font-size:10px;color:#a8a7a0;margin-top:2px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.kpi .kv.danger{color:#dc2626}.kpi .kv.ok{color:#16a34a}
.rtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
.rtable th{text-align:left;padding:7px 8px;font-size:10px;font-weight:600;color:#72716c;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #e8e7e0;white-space:nowrap;background:#fafaf8}
.rtable td{padding:7px 8px;border-bottom:1px solid #f0efe9;vertical-align:middle}
.rtable tr:last-child td{font-weight:700;background:#f0eff0;border-bottom:none}
.mini-bar{height:4px;background:#f0efe9;border-radius:3px;margin-top:3px}
.mini-fill{height:100%;border-radius:3px}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
.tag-ok{background:#dcfce7;color:#166534}
.tag-warn{background:#fef9c3;color:#854d0e}
.tag-danger{background:#fee2e2;color:#991f1f}
.pblock{background:#fff;border:1px solid #e8e7e0;border-radius:16px;margin-bottom:20px;overflow:hidden}
.pblock-header{padding:16px 24px;border-bottom:1px solid #f0efe9;display:flex;justify-content:space-between;align-items:center;background:#0f2a52}
.pblock-name{font-size:16px;font-weight:700;color:#fff}
.pblock-sub{font-size:12px;color:#7eb3f5;margin-top:2px}
.pill{font-size:11px;padding:4px 12px;border-radius:20px;font-weight:700}
.pill-ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.pill-warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.pill-danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
.pblock-body{padding:20px 24px}
.exec-label{font-size:11px;font-weight:600;color:#72716c;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.exec-bar-track{height:12px;background:#f0efe9;border-radius:6px;overflow:hidden}
.exec-bar-fill{height:100%;border-radius:6px;transition:width .5s}
.channels-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.ch-card{background:#f5f5f2;border-radius:10px;padding:12px 14px}
.ch-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ch-card-name{font-size:11px;font-weight:600;color:#52514e;display:flex;align-items:center;gap:5px}
.ch-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ch-bar{height:7px;background:#e8e7e0;border-radius:4px;overflow:hidden;margin-bottom:8px}
.ch-bar-fill{height:100%;border-radius:4px}
.ch-amounts{display:flex;justify-content:space-between;font-size:11px}
.ch-amounts .spent{font-weight:600;color:#1a1a18}
.ch-amounts .ppto{color:#a8a7a0}
.iva-badge{font-size:9px;background:#eff6ff;color:#1d4ed8;padding:1px 5px;border-radius:4px;font-weight:600}
.leads-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lead-box{border-radius:10px;padding:10px;text-align:center;border:1px solid transparent}
.lead-box .lv{font-size:22px;font-weight:700;line-height:1}
.lead-box .ll{font-size:9px;font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.lb-meta{background:#eff6ff;border-color:#bfdbfe}.lb-meta .lv{color:#1d4ed8}.lb-meta .ll{color:#3b82f6}
.lb-google{background:#f0fdf4;border-color:#bbf7d0}.lb-google .lv{color:#15803d}.lb-google .ll{color:#22c55e}
.lb-cliengo{background:#fdf4ff;border-color:#e9d5ff}.lb-cliengo .lv{color:#7e22ce}.lb-cliengo .ll{color:#a855f7}
.lb-web{background:#fff7ed;border-color:#fed7aa}.lb-web .lv{color:#c2410c}.lb-web .ll{color:#f97316}
.lb-total{background:#f0efe9;border-color:#d4d3cb}.lb-total .lv{color:#1a1a18}.lb-total .ll{color:#72716c}
.leads-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f5f5f2;border-radius:8px;margin-top:10px;font-size:13px}
.divider{height:1px;background:#f0efe9;margin:16px 0}
.ppto-editor{background:#fff8e6;border:1px solid #fde68a;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.ppto-editor-title{font-size:11px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.ppto-toggle{font-size:11px;font-weight:500;cursor:pointer;color:#b45309;background:none;border:none;text-decoration:underline}
.ppto-form{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ppto-form.open{display:grid}
.pfgrp label{font-size:11px;color:#92400e;display:block;margin-bottom:3px;font-weight:500}
.pfgrp input{width:100%;font-size:13px;padding:6px 9px;border:1px solid #fcd34d;border-radius:7px;background:#fff;outline:none}
.ppto-save{margin-top:10px;background:#92400e;color:#fff;border:none;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.ppto-vals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pv{text-align:center}
.pv .pvv{font-size:14px;font-weight:600;color:#92400e}
.pv .pvl{font-size:10px;color:#b45309;margin-top:2px;font-weight:500}
.leads-meta-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px 16px;margin:12px 0}
.lm-title{font-size:11px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.lm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.lm-stat{text-align:center;background:#fff;border-radius:8px;padding:8px}
.lm-stat .lsv{font-size:20px;font-weight:700}
.lm-stat .lsl{font-size:10px;color:#93c5fd;font-weight:600;margin-top:2px;text-transform:uppercase}
.lm-prog-label{display:flex;justify-content:space-between;font-size:11px;color:#1e40af;margin-bottom:4px;font-weight:500}
.lm-bar-track{height:10px;background:#dbeafe;border-radius:6px;overflow:hidden}
.lm-bar-fill{height:100%;border-radius:6px;transition:width .5s}
.lm-sem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.lm-sem{background:#fff;border-radius:8px;padding:8px 6px;text-align:center;border:2px solid transparent}
.lm-sem.active{border-color:#3b82f6}
.lm-sem .sv{font-size:16px;font-weight:700}
.lm-sem .sl{font-size:10px;color:#93c5fd;font-weight:600;margin-bottom:4px}
.lm-sem .sm{font-size:10px;color:#a8a7a0;margin-top:2px}
.lm-sem .sb{height:4px;background:#dbeafe;border-radius:3px;margin-top:4px;overflow:hidden}
.lm-sem .sbf{height:100%;border-radius:3px}
.lm-edit-form{display:none;margin-top:10px}
.lm-edit-row{display:flex;gap:8px;align-items:flex-end}
.lm-edit-row input{flex:1;font-size:14px;padding:7px 10px;border:1px solid #93c5fd;border-radius:7px;background:#fff;outline:none}
.lm-btn{padding:8px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.lm-btn-save{background:#1e40af;color:#fff}
.lm-btn-cancel{background:#e0e7ff;color:#1e40af}
.form-section{background:#fafaf8;border:1px dashed #dddcd5;border-radius:12px;padding:16px 18px}
.form-title{font-size:11px;font-weight:700;color:#52514e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
.form-group-label{font-size:11px;font-weight:600;color:#a8a7a0;margin:12px 0 8px;padding-bottom:4px;border-bottom:1px solid #e8e7e0}
.form-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fgrp label{font-size:11px;color:#72716c;display:block;margin-bottom:3px;font-weight:500}
.fgrp input{width:100%;font-size:13px;padding:7px 10px;border:1px solid #dddcd5;border-radius:7px;background:#fff}
.fgrp input:focus{border-color:#2a78d6;outline:none;box-shadow:0 0 0 3px rgba(42,120,214,.1)}
.form-footer{display:flex;justify-content:flex-end;margin-top:14px}
.save-btn{background:#0f2a52;color:#fff;border:none;padding:9px 22px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.overspend{background:#fff1f2;border:1px solid #fecdd3;border-radius:10px;padding:12px 16px;margin-bottom:16px}
.overspend-title{font-size:12px;font-weight:700;color:#be123c;margin-bottom:8px}
.overspend-row{display:flex;justify-content:space-between;font-size:12px;color:#9f1239;padding:3px 0}
.overspend-total{font-weight:700;font-size:13px;color:#be123c;border-top:1px solid #fecdd3;padding-top:6px;margin-top:4px}
footer{text-align:center;padding:24px;font-size:11px;color:#a8a7a0}
</style>
</head>
<body>

<nav>
  <div class="logo">Conintel <span>/ Tracker Semanal</span></div>
  <div style="display:flex;align-items:center;gap:16px">
    <span id="save-indicator" style="color:#4ade80;font-size:12px;font-weight:500;opacity:0;transition:opacity .5s"></span>
    <span id="periodo-nav" style="color:#7eb3f5;font-size:12px">Agosto 2026</span>
    <button onclick="resetearDatos()" style="background:rgba(255,255,255,.1);color:#f9a8a8;border:none;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:500">↺ Resetear</button>
  </div>
</nav>

<div class="ctrl-strip">
  <div class="ctrl-group">
    <label>Mes</label>
    <select id="mes-sel" onchange="recalcular()">
      <option value="8">Agosto 2026</option>
      <option value="9" selected>Septiembre 2026</option>
      <option value="10">Octubre 2026</option>
      <option value="11">Noviembre 2026</option>
      <option value="12">Diciembre 2026</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>Semana activa</label>
    <select id="semana-sel" onchange="setSemana(parseInt(this.value))">
      <option value="0">Semana 1</option>
      <option value="1">Semana 2</option>
      <option value="2">Semana 3</option>
      <option value="0" selected>Semana 1</option>
      <option value="1">Semana 2</option>
      <option value="2">Semana 3</option>
      <option value="3">Semana 4</option>
    </select>
  </div>
</div>

<div class="main">
  <div class="week-tabs" id="week-tabs"></div>
  <div id="resumen-gen"></div>
  <div id="proyectos-list"></div>
</div>

<footer>Conintel · Septiembre 2026 · Google Ads incluye IVA 19% · Cliengo y Web se registran por separado</footer>

<script>
var IVA = 0.19;
var MESES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var PROYECTOS = ['CIRUELO','RIOMANSO','CURUBAL','TRES CANTOS'];
var STORAGE_KEY = 'conintel_tracker_sep2026';
var semana = 0;

var PPTOS_DEFAULT = {
  'CIRUELO':     {meta:3900000,google:399999, ext:625000},
  'RIOMANSO':    {meta:3200000,google:1000000,ext:625000},
  'CURUBAL':     {meta:2876000,google:1260000,ext:625000},
  'TRES CANTOS': {meta:2496000,google:1600000,ext:600000}
};
var META_LEADS_DEFAULT = {
  'CIRUELO':200,'RIOMANSO':200,'CURUBAL':294,'TRES CANTOS':200
};

// Datos historicos de agosto — solo se cargan si el mes es 8
var DATA_AGOSTO = {
  'CIRUELO': [
    {spend_meta:1066132,spend_google:75888,spend_ext:137792,leads_meta:21,leads_google:1,leads_cliengo:1,leads_web:0},
    {spend_meta:1066132,spend_google:75888,spend_ext:137792,leads_meta:21,leads_google:2,leads_cliengo:1,leads_web:0},
    {spend_meta:1066131,spend_google:75887,spend_ext:137792,leads_meta:22,leads_google:2,leads_cliengo:1,leads_web:0},
    {spend_meta:1068131,spend_google:75887,spend_ext:137792,leads_meta:21,leads_google:1,leads_cliengo:1,leads_web:0}
  ],
  'RIOMANSO': [
    {spend_meta:1136884,spend_google:321502,spend_ext:137792,leads_meta:24,leads_google:14,leads_cliengo:7,leads_web:2},
    {spend_meta:1136884,spend_google:321502,spend_ext:137792,leads_meta:23,leads_google:13,leads_cliengo:7,leads_web:0},
    {spend_meta:1136884,spend_google:321502,spend_ext:137792,leads_meta:24,leads_google:13,leads_cliengo:8,leads_web:0},
    {spend_meta:1136884,spend_google:321501,spend_ext:137792,leads_meta:23,leads_google:13,leads_cliengo:7,leads_web:0}
  ],
  'CURUBAL': [
    {spend_meta:1001588,spend_google:205795,spend_ext:137792,leads_meta:44,leads_google:6,leads_cliengo:2,leads_web:0},
    {spend_meta:1001588,spend_google:205795,spend_ext:137792,leads_meta:44,leads_google:6,leads_cliengo:2,leads_web:0},
    {spend_meta:1001588,spend_google:205795,spend_ext:137792,leads_meta:44,leads_google:7,leads_cliengo:3,leads_web:0},
    {spend_meta:1001587,spend_google:205796,spend_ext:137792,leads_meta:44,leads_google:6,leads_cliengo:2,leads_web:0}
  ],
  'TRES CANTOS': [
    {spend_meta:593432,spend_google:237753,spend_ext:137792,leads_meta:11,leads_google:7,leads_cliengo:2,leads_web:0},
    {spend_meta:593432,spend_google:237753,spend_ext:137792,leads_meta:11,leads_google:7,leads_cliengo:2,leads_web:0},
    {spend_meta:593432,spend_google:237754,spend_ext:137792,leads_meta:10,leads_google:7,leads_cliengo:3,leads_web:0},
    {spend_meta:593432,spend_google:237753,spend_ext:137792,leads_meta:11,leads_google:7,leads_cliengo:2,leads_web:1}
  ]
};

function dataVacia() {
  var d = {};
  PROYECTOS.forEach(function(p){
    d[p] = [0,1,2,3].map(function(){ return {spend_meta:0,spend_google:0,spend_ext:0,leads_meta:0,leads_google:0,leads_cliengo:0,leads_web:0}; });
  });
  return d;
}

var PPTOS = JSON.parse(JSON.stringify(PPTOS_DEFAULT));
var META_LEADS = JSON.parse(JSON.stringify(META_LEADS_DEFAULT));
var DATA = dataVacia();
var mesPrevio = 9;

// STORAGE
function guardarStorage() {
  var sel = document.getElementById('mes-sel');
  var mes = sel ? parseInt(sel.value)||8 : mesPrevio;
  try {
    var stored = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    stored['mes_'+mes] = {
      DATA: JSON.parse(JSON.stringify(DATA)),
      PPTOS: JSON.parse(JSON.stringify(PPTOS)),
      META_LEADS: JSON.parse(JSON.stringify(META_LEADS))
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
    var el = document.getElementById('save-indicator');
    if (el) {
      var t = new Date();
      el.textContent = '✓ Guardado ' + t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');
      el.style.opacity = '1';
      setTimeout(function(){ el.style.opacity='0'; }, 3000);
    }
  } catch(e) {}
}
function cargarMes(mes) {
  try {
    var stored = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    var key = 'mes_'+mes;

    if (stored[key]) {
      // Mes ya guardado — cargar exactamente lo que hay
      var parsed = stored[key];
      DATA = dataVacia();
      if (parsed.DATA) PROYECTOS.forEach(function(p){ if(parsed.DATA[p]) DATA[p]=JSON.parse(JSON.stringify(parsed.DATA[p])); });
      if (parsed.PPTOS) PROYECTOS.forEach(function(p){ if(parsed.PPTOS[p]) PPTOS[p]=JSON.parse(JSON.stringify(parsed.PPTOS[p])); });
      if (parsed.META_LEADS) PROYECTOS.forEach(function(p){ if(parsed.META_LEADS[p]!==undefined) META_LEADS[p]=parsed.META_LEADS[p]; });

    } else if (mes === 8) {
      // Agosto: datos historicos precargados
      DATA = JSON.parse(JSON.stringify(DATA_AGOSTO));
      PPTOS = JSON.parse(JSON.stringify(PPTOS_DEFAULT));
      META_LEADS = JSON.parse(JSON.stringify(META_LEADS_DEFAULT));

    } else if (mes === 9) {
      // Septiembre — datos semana 2 precargados
      DATA = dataVacia();
      DATA['CIRUELO'][1]     = {spend_meta:1502000,spend_google:31317, spend_ext:125010,leads_meta:29,leads_google:0,leads_cliengo:0,leads_web:0};
      DATA['CURUBAL'][1]     = {spend_meta:1342393,spend_google:39519, spend_ext:125010,leads_meta:61,leads_google:0,leads_cliengo:0,leads_web:0};
      DATA['RIOMANSO'][1]    = {spend_meta:1046264,spend_google:0,     spend_ext:125010,leads_meta:30,leads_google:0,leads_cliengo:0,leads_web:0};
      DATA['TRES CANTOS'][1] = {spend_meta:815811, spend_google:1604000,spend_ext:125010,leads_meta:15,leads_google:0,leads_cliengo:0,leads_web:0};
    } else {
      // Mes nuevo sin datos: cero en gasto/leads, hereda presupuestos del mes anterior
      DATA = dataVacia();
      var prevKey = 'mes_'+(mes-1);
      var prevData = stored[prevKey] || null;
      PPTOS = prevData && prevData.PPTOS ? JSON.parse(JSON.stringify(prevData.PPTOS)) : JSON.parse(JSON.stringify(PPTOS_DEFAULT));
      META_LEADS = prevData && prevData.META_LEADS ? JSON.parse(JSON.stringify(prevData.META_LEADS)) : JSON.parse(JSON.stringify(META_LEADS_DEFAULT));
    }

  } catch(e) {
    DATA = dataVacia();
    PPTOS = JSON.parse(JSON.stringify(PPTOS_DEFAULT));
    META_LEADS = JSON.parse(JSON.stringify(META_LEADS_DEFAULT));
  }
}
function resetearDatos() {
  if (!confirm('¿Borrar todos los datos guardados? Esto no se puede deshacer.')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// HELPERS
function fmt(n) { return '$' + Math.round(n).toLocaleString('es-CO'); }
function pct(s,p) { return p>0 ? Math.min(Math.round(s/p*100),999) : 0; }
function barC(p) { return p>100?'#ef4444':p>80?'#f59e0b':'#22c55e'; }
function pillC(p) { return p>100?'pill-danger':p>80?'pill-warn':'pill-ok'; }
function pillT(p) { return p>100?p+'% ⚠ Excedido':p>80?p+'% Cerca del límite':p+'% En rango'; }
function tagC(p)  { return p>100?'tag-danger':p>80?'tag-warn':'tag-ok'; }
function ppto_total(p) { var pp=PPTOS[p]; return pp.meta+pp.google*(1+IVA)+pp.ext; }
function acum(p) {
  var sm=0,sg=0,se=0,lm=0,lg=0,lc=0,lw=0;
  DATA[p].forEach(function(w){ sm+=w.spend_meta;sg+=w.spend_google;se+=w.spend_ext;lm+=w.leads_meta;lg+=w.leads_google;lc+=w.leads_cliengo;lw+=w.leads_web; });
  var sg_iva=sg*(1+IVA);
  return {sm:sm,sg:sg,sg_iva:sg_iva,se:se,lm:lm,lg:lg,lc:lc,lw:lw,total:sm+sg_iva+se,leads:lm+lg+lc+lw};
}

function setSemana(i) { semana=i; document.getElementById('semana-sel').value=i; recalcular(); }
function togglePpto(pi) { var f=document.getElementById('pptoform-'+pi); f.classList.toggle('open'); }

function guardarPpto(pi,p) {
  PPTOS[p]={
    meta:  parseFloat(document.getElementById('pp-meta-'+pi).value)||0,
    google:parseFloat(document.getElementById('pp-google-'+pi).value)||0,
    ext:   parseFloat(document.getElementById('pp-ext-'+pi).value)||0
  };
  document.getElementById('pptoform-'+pi).classList.remove('open');
  guardarStorage(); recalcular();
}

function editarMetaLeads(pi) {
  document.getElementById('lm-view-'+pi).style.display='none';
  document.getElementById('lm-form-'+pi).style.display='block';
}
function cancelarMetaLeads(pi) {
  document.getElementById('lm-view-'+pi).style.display='block';
  document.getElementById('lm-form-'+pi).style.display='none';
}
function guardarMetaLeads(pi,p) {
  META_LEADS[p]=parseFloat(document.getElementById('lm-input-'+pi).value)||0;
  document.getElementById('lm-form-'+pi).style.display='none';
  document.getElementById('lm-view-'+pi).style.display='block';
  guardarStorage(); recalcular();
}

function guardar(pi,p) {
  DATA[p][semana]={
    spend_meta:    parseFloat(document.getElementById('sm-'+pi).value)||0,
    spend_google:  parseFloat(document.getElementById('sg-'+pi).value)||0,
    spend_ext:     parseFloat(document.getElementById('se-'+pi).value)||0,
    leads_meta:    parseFloat(document.getElementById('lm-'+pi).value)||0,
    leads_google:  parseFloat(document.getElementById('lg-'+pi).value)||0,
    leads_cliengo: parseFloat(document.getElementById('lc-'+pi).value)||0,
    leads_web:     parseFloat(document.getElementById('lw-'+pi).value)||0
  };
  guardarStorage(); recalcular();
}

function recalcular() {
  var mes=parseInt(document.getElementById('mes-sel').value)||8;
  if (mes !== mesPrevio) {
    guardarStorage();
    mesPrevio = mes;
    // Reset to clean state first
    DATA = dataVacia();
    PPTOS = JSON.parse(JSON.stringify(PPTOS_DEFAULT));
    META_LEADS = JSON.parse(JSON.stringify(META_LEADS_DEFAULT));
    cargarMes(mes);
  }
  document.getElementById('periodo-nav').textContent=MESES[mes]+' 2026';
  renderTabs(); renderResumen(); renderProyectos();
}

function renderTabs() {
  document.getElementById('week-tabs').innerHTML=[0,1,2,3].map(function(i){
    return '<button class="btn-tab '+(i===semana?'active':'')+'" onclick="setSemana('+i+')">Semana '+(i+1)+'</button>';
  }).join('');
}

function renderResumen() {
  var tp=0,ts=0,tl=0,texc=0;
  var rows=PROYECTOS.map(function(p){
    var a=acum(p),pt=ppto_total(p),ej=pct(a.total,pt);
    tp+=pt; ts+=a.total; tl+=a.leads;
    if(a.total>pt) texc+=a.total-pt;
    return {p:p,a:a,pt:pt,ej:ej,disp:pt-a.total};
  });
  var tot_ej=pct(ts,tp),disp=tp-ts,cpl=tl>0?Math.round(ts/tl):0;
  var html='<div class="resumen-card">';
  html+='<div class="section-title">Resumen general acumulado <span>Semanas 1–'+(semana+1)+' de 4</span></div>';
  html+='<div style="margin-bottom:16px">';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px">';
  html+='<div><div style="font-size:22px;font-weight:700">'+fmt(ts)+'</div><div style="font-size:12px;color:#a8a7a0">gastado de '+fmt(tp)+' presupuestado</div></div>';
  html+='<span class="tag '+tagC(tot_ej)+'" style="font-size:14px;padding:5px 14px;border-radius:20px">'+tot_ej+'%</span></div>';
  html+='<div class="big-bar-track"><div class="big-bar-fill" style="width:'+Math.min(tot_ej,100)+'%;background:'+barC(tot_ej)+'"></div></div>';
  html+='<div style="display:flex;justify-content:space-between;font-size:12px;color:#a8a7a0;margin-top:5px">';
  html+='<span>Disponible: <b style="color:'+(disp<0?'#dc2626':'#16a34a')+'">'+fmt(disp)+'</b></span>';
  html+=(texc>0?'<span>Exceso total: <b style="color:#dc2626">'+fmt(texc)+'</b></span>':'')+'</div></div>';
  html+='<div class="kpi-row">';
  html+='<div class="kpi"><div class="kv">'+fmt(tp)+'</div><div class="kl">Ppto total</div></div>';
  html+='<div class="kpi"><div class="kv">'+fmt(ts)+'</div><div class="kl">Gasto actual</div></div>';
  html+='<div class="kpi"><div class="kv '+(disp<0?'danger':'ok')+'">'+fmt(disp)+'</div><div class="kl">Disponible</div></div>';
  html+='<div class="kpi"><div class="kv">'+tl+'</div><div class="kl">Leads totales</div></div>';
  html+='<div class="kpi"><div class="kv">'+fmt(cpl)+'</div><div class="kl">CPL combinado</div></div>';
  html+='</div>';
  html+='<div style="overflow-x:auto"><table class="rtable"><thead><tr>';
  html+='<th>Proyecto</th><th>Presupuesto</th><th>Gasto acum.</th><th>Disponible</th><th>Ejec.%</th>';
  html+='<th>L.Meta</th><th>L.Google</th><th>L.Cliengo</th><th>L.Web</th><th>Total leads</th><th>Meta leads</th><th>% Meta</th><th>CPL</th>';
  html+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var ml=META_LEADS[r.p]||0;
    var mlpct=ml>0?pct(r.a.leads,ml):0;
    html+='<tr>';
    html+='<td><b>'+r.p+'</b></td>';
    html+='<td>'+fmt(r.pt)+'</td>';
    html+='<td>'+fmt(r.a.total)+'<div class="mini-bar"><div class="mini-fill" style="width:'+Math.min(r.ej,100)+'%;background:'+barC(r.ej)+'"></div></div></td>';
    html+='<td style="color:'+(r.disp<0?'#dc2626':'#16a34a')+';font-weight:600">'+fmt(r.disp)+'</td>';
    html+='<td><span class="tag '+tagC(r.ej)+'">'+r.ej+'%</span></td>';
    html+='<td>'+r.a.lm+'</td><td>'+r.a.lg+'</td><td>'+r.a.lc+'</td><td>'+r.a.lw+'</td>';
    html+='<td><b>'+r.a.leads+'</b><div class="mini-bar"><div class="mini-fill" style="width:'+(ml>0?Math.min(Math.round(r.a.leads/ml*100),100):0)+'%;background:#3b82f6"></div></div></td>';
    html+='<td>'+ml+'</td>';
    html+='<td>'+(ml>0?'<span class="tag '+tagC(mlpct)+'">'+mlpct+'%</span>':'—')+'</td>';
    html+='<td>'+(r.a.leads>0?fmt(Math.round(r.a.total/r.a.leads)):'—')+'</td>';
    html+='</tr>';
  });
  // totals
  var tlm=rows.reduce(function(a,r){return a+r.a.lm;},0);
  var tlg=rows.reduce(function(a,r){return a+r.a.lg;},0);
  var tlc=rows.reduce(function(a,r){return a+r.a.lc;},0);
  var tlw=rows.reduce(function(a,r){return a+r.a.lw;},0);
  var tml=PROYECTOS.reduce(function(a,p){return a+(META_LEADS[p]||0);},0);
  var tmpct=tml>0?pct(tl,tml):0;
  html+='<tr><td>TOTAL CONINTEL</td><td>'+fmt(tp)+'</td><td>'+fmt(ts)+'</td>';
  html+='<td style="color:'+(disp<0?'#dc2626':'#16a34a')+'">'+fmt(disp)+'</td>';
  html+='<td><span class="tag '+tagC(tot_ej)+'">'+tot_ej+'%</span></td>';
  html+='<td>'+tlm+'</td><td>'+tlg+'</td><td>'+tlc+'</td><td>'+tlw+'</td>';
  html+='<td><b>'+tl+'</b></td><td>'+tml+'</td>';
  html+='<td><span class="tag '+tagC(tmpct)+'">'+tmpct+'%</span></td>';
  html+='<td>'+fmt(cpl)+'</td></tr>';
  html+='</tbody></table></div></div>';
  document.getElementById('resumen-gen').innerHTML=html;
}

function renderProyectos() {
  var html='';
  PROYECTOS.forEach(function(p,pi){
    var a=acum(p),w=DATA[p][semana],pp=PPTOS[p],pt=ppto_total(p);
    var ej=pct(a.total,pt),disp=pt-a.total,cpl=a.leads>0?Math.round(a.total/a.leads):0;
    var pm=pct(a.sm,pp.meta),pg=pct(a.sg_iva,pp.google*(1+IVA)),pe=pct(a.se,pp.ext);
    var exceso=a.total>pt?a.total-pt:0;
    var exc_m=a.sm>pp.meta?a.sm-pp.meta:0;
    var exc_g=a.sg_iva>pp.google*(1+IVA)?a.sg_iva-pp.google*(1+IVA):0;
    var exc_e=a.se>pp.ext?a.se-pp.ext:0;
    var sg_iva_sem=w.spend_google*(1+IVA);
    var total_sem=w.spend_meta+sg_iva_sem+w.spend_ext;
    var leads_sem=w.leads_meta+w.leads_google+w.leads_cliengo+w.leads_web;

    // Meta leads tracker
    var ml=META_LEADS[p]||0;
    var mlpct=ml>0?pct(a.leads,ml):0;
    var mlC=mlpct>=100?'#16a34a':mlpct>=75?'#2563eb':mlpct>=50?'#f59e0b':'#dc2626';
    var faltante=Math.max(ml-a.leads,0);
    var mlexc=a.leads>ml?a.leads-ml:0;
    var metaSem=ml>0?Math.round(ml/4):0;

    html+='<div class="pblock">';
    html+='<div class="pblock-header"><div><div class="pblock-name">'+p+'</div><div class="pblock-sub">Acumulado: '+fmt(a.total)+' · Ppto: '+fmt(pt)+'</div></div>';
    html+='<span class="pill '+pillC(ej)+'">'+pillT(ej)+'</span></div>';
    html+='<div class="pblock-body">';

    // overspend
    if(exceso>0){
      html+='<div class="overspend"><div class="overspend-title">⚠ Presupuesto excedido</div>';
      if(exc_m>0) html+='<div class="overspend-row"><span>Meta Ads</span><span>'+fmt(exc_m)+'</span></div>';
      if(exc_g>0) html+='<div class="overspend-row"><span>Google Ads +IVA</span><span>'+fmt(exc_g)+'</span></div>';
      if(exc_e>0) html+='<div class="overspend-row"><span>Exterior</span><span>'+fmt(exc_e)+'</span></div>';
      html+='<div class="overspend-row overspend-total"><span>Total excedido</span><span>'+fmt(exceso)+'</span></div></div>';
    }

    // presupuesto editable
    html+='<div class="ppto-editor"><div class="ppto-editor-title">Presupuestos del mes<button class="ppto-toggle" onclick="togglePpto('+pi+')">✏ Editar</button></div>';
    html+='<div class="ppto-vals">';
    html+='<div class="pv"><div class="pvv">'+fmt(pp.meta)+'</div><div class="pvl">Meta Ads</div></div>';
    html+='<div class="pv"><div class="pvv">'+fmt(pp.google*(1+IVA))+'</div><div class="pvl">Google +IVA</div></div>';
    html+='<div class="pv"><div class="pvv">'+fmt(pp.ext)+'</div><div class="pvl">Exterior</div></div></div>';
    html+='<div class="ppto-form" id="pptoform-'+pi+'">';
    html+='<div class="pfgrp"><label>Ppto Meta</label><input type="number" id="pp-meta-'+pi+'" value="'+pp.meta+'"></div>';
    html+='<div class="pfgrp"><label>Ppto Google (sin IVA)</label><input type="number" id="pp-google-'+pi+'" value="'+pp.google+'"></div>';
    html+='<div class="pfgrp"><label>Ppto Exterior</label><input type="number" id="pp-ext-'+pi+'" value="'+pp.ext+'"></div>';
    html+='<button class="ppto-save" onclick="guardarPpto('+pi+',\''+p+'\')">Guardar presupuestos</button></div></div>';

    // barra ejecucion
    html+='<div style="margin-bottom:20px">';
    html+='<div class="exec-label">Ejecución acumulada — semanas 1 a '+(semana+1)+'</div>';
    html+='<div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center">';
    html+='<div><div class="exec-bar-track"><div class="exec-bar-fill" style="width:'+Math.min(ej,100)+'%;background:'+barC(ej)+'"></div></div>';
    html+='<div style="display:flex;justify-content:space-between;font-size:11px;color:#a8a7a0;margin-top:4px">';
    html+='<span>Gastado: <b style="color:#1a1a18">'+fmt(a.total)+'</b></span>';
    html+='<span>Disponible: <b style="color:'+(disp<0?'#dc2626':'#16a34a')+'">'+fmt(disp)+'</b></span>';
    html+='<span>Ppto: <b style="color:#1a1a18">'+fmt(pt)+'</b></span></div></div>';
    html+='<div style="text-align:right"><b style="color:'+barC(ej)+';font-size:24px">'+ej+'%</b></div></div></div>';

    // canales
    html+='<div class="exec-label" style="margin-bottom:10px">Inversión acumulada por canal</div>';
    html+='<div class="channels-grid">';
    html+='<div class="ch-card"><div class="ch-card-head"><span class="ch-card-name"><span class="ch-dot" style="background:#2563eb"></span>Meta Ads</span><span style="font-size:12px;font-weight:700;color:'+barC(pm)+'">'+pm+'%</span></div>';
    html+='<div class="ch-bar"><div class="ch-bar-fill" style="width:'+Math.min(pm,100)+'%;background:'+barC(pm)+'"></div></div>';

    html+='<div class="ch-amounts"><span class="spent">'+fmt(a.se)+'</span><span class="ppto">ppto '+fmt(pp.ext)+'</span></div></div></div>';

    // leads por fuente
    html+='<div class="exec-label" style="margin-bottom:10px">Leads acumulados — por fuente</div>';
    html+='<div class="leads-row">';
    html+='<div class="lead-box lb-meta"><div class="lv">'+a.lm+'</div><div class="ll">Meta</div></div>';

    html+='<div class="lead-box lb-cliengo"><div class="lv">'+a.lc+'</div><div class="ll">Cliengo</div></div>';

    html+='<div class="lm-title">🎯 Meta de leads del mes<button onclick="editarMetaLeads('+pi+')" style="font-size:11px;color:#3b82f6;background:none;border:none;cursor:pointer;text-decoration:underline;font-weight:500">✏ Editar</button></div>';

    html+='<div class="lm-stats">';
    html+='<div class="lm-stat"><div class="lsv" style="color:#1e40af">'+ml+'</div><div class="lsl">Meta mes</div></div>';
    html+='<div class="lm-stat"><div class="lsv" style="color:'+mlC+'">'+a.leads+'</div><div class="lsl">Leads acum.</div></div>';
    html+='<div class="lm-stat"><div class="lsv" style="color:'+(mlexc>0?'#16a34a':faltante>0?'#dc2626':'#1e40af')+'">'+(mlexc>0?'+'+mlexc:faltante>0?'-'+faltante:'✓')+'</div><div class="lsl">'+(mlexc>0?'Superado':faltante>0?'Faltante':'Exacto')+'</div></div>';

    html+='<div class="lm-prog-label"><span>Progreso hacia la meta</span><span>'+mlpct+'%</span></div>';
    html+='<div class="lm-bar-track"><div class="lm-bar-fill" style="width:'+Math.min(mlpct,100)+'%;background:'+mlC+'"></div></div>';
    html+='<div style="font-size:11px;font-weight:600;color:#1e40af;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em">Semana a semana</div>';
    html+='<div class="lm-sem-grid">';
    [0,1,2,3].forEach(function(s){
      var wd=DATA[p][s];
      var wl=wd.leads_meta+wd.leads_google+wd.leads_cliengo+wd.leads_web;
      var wp=metaSem>0?Math.min(Math.round(wl/metaSem*100),999):0;
      var wc=wp>=100?'#16a34a':wp>=75?'#2563eb':wp>=50?'#f59e0b':'#dc2626';
      html+='<div class="lm-sem'+(s===semana?' active':'')+'">';
      html+='<div class="sl">SEM '+(s+1)+(s===semana?' ◀':'')+'</div>';
      html+='<div class="sv" style="color:'+wc+'">'+wl+'</div>';
      html+='<div class="sm">/ '+metaSem+'</div>';
      html+='<div class="sb"><div class="sbf" style="width:'+Math.min(wp,100)+'%;background:'+wc+'"></div></div></div>';
    });
    html+='</div></div>';
    // edit form
    html+='<div class="lm-edit-form" id="lm-form-'+pi+'">';
    html+='<div class="lm-edit-row">';
    html+='<div style="flex:1"><label style="font-size:11px;color:#1e40af;font-weight:500;display:block;margin-bottom:3px">Meta de leads del mes</label>';

    html+='<button class="lm-btn lm-btn-cancel" onclick="cancelarMetaLeads('+pi+')">Cancelar</button></div></div>';
    html+='</div>'; // leads-meta-box

    html+='<div class="divider"></div>';

    // form semanal
    html+='<div class="form-section"><div class="form-title">✏ Ingresar datos — Semana '+(semana+1)+'</div>';
    html+='<div class="form-group-label">Inversión (COP)</div>';
    html+='<div class="form-row">';
    html+='<div class="fgrp"><label>Spend Meta</label><input type="number" id="sm-'+pi+'" value="'+w.spend_meta+'"></div>';
    html+='<div class="fgrp"><label>Spend Google <span style="font-size:10px;color:#a8a7a0">(sin IVA)</span></label><input type="number" id="sg-'+pi+'" value="'+w.spend_google+'"></div>';
    html+='<div class="fgrp"><label>Spend Exterior</label><input type="number" id="se-'+pi+'" value="'+w.spend_ext+'"></div></div>';
    html+='<div class="form-group-label">Leads — cada fuente por separado</div>';
    html+='<div class="form-row-4">';
    html+='<div class="fgrp"><label>Meta</label><input type="number" id="lm-'+pi+'" value="'+w.leads_meta+'"></div>';
    html+='<div class="fgrp"><label>Google</label><input type="number" id="lg-'+pi+'" value="'+w.leads_google+'"></div>';
    html+='<div class="fgrp"><label>Cliengo</label><input type="number" id="lc-'+pi+'" value="'+w.leads_cliengo+'"></div>';
    html+='<div class="fgrp"><label>Web</label><input type="number" id="lw-'+pi+'" value="'+w.leads_web+'"></div></div>';
    html+='<div class="form-footer"><button class="save-btn" onclick="guardar('+pi+',\''+p+'\')">Guardar Semana '+(semana+1)+'</button></div></div>';

    html+='</div></div>'; // pblock-body, pblock
  });
  document.getElementById('proyectos-list').innerHTML=html;
}

cargarMes(9); // cargar septiembre al inicio
semana = 1; // iniciar en semana 2
document.getElementById('semana-sel').value = 1;
recalcular();
